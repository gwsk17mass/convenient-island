name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift-build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check repository safety
        run: zsh scripts/preflight-github.sh
      - name: Build Swift package
        run: swift build
